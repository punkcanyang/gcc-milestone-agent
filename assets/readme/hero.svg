<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">gcc-milestone-agent</title>
  <desc id="desc">CLI that verifies grant milestones from multi-source public evidence and produces scored markdown, JSON, and HTML reports.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#121A24"/>
    </linearGradient>
    <linearGradient id="scoreFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8A838"/>
      <stop offset="100%" stop-color="#F0C46A"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1E2A38"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="22" fill="url(#dotGrid)" opacity="0.55"/>
  <rect x="1" y="1" width="1198" height="378" rx="21" fill="none" stroke="#243041" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="0" y="48" width="6" height="120" rx="3" fill="#5B9FD4"/>

  <!-- Title block -->
  <g transform="translate(56 52)">
    <text x="0" y="0" fill="#6B8AAB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2">NODE CLI · GCC MILESTONE VERIFICATION</text>
    <text x="0" y="52" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="44" font-weight="700">gcc-milestone-agent</text>
    <text x="0" y="100" fill="#A8B8CC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22">Verify grant milestones from public evidence.</text>
    <text x="0" y="132" fill="#A8B8CC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22">Score rules. Ship markdown / JSON / HTML reports.</text>

    <!-- Motif chips -->
    <g transform="translate(0 168)">
      <rect x="0" y="0" width="118" height="34" rx="8" fill="#16202C" stroke="#2A3A4E"/>
      <circle cx="18" cy="17" r="5" fill="#3D9A6A"/>
      <text x="32" y="22" fill="#C8D4E4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">evidence</text>

      <rect x="130" y="0" width="92" height="34" rx="8" fill="#16202C" stroke="#2A3A4E"/>
      <circle cx="148" cy="17" r="5" fill="#E8A838"/>
      <text x="162" y="22" fill="#C8D4E4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">rules</text>

      <rect x="234" y="0" width="96" height="34" rx="8" fill="#16202C" stroke="#2A3A4E"/>
      <circle cx="252" cy="17" r="5" fill="#5B9FD4"/>
      <text x="266" y="22" fill="#C8D4E4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">reports</text>
    </g>

    <!-- Terminal prompt line -->
    <g transform="translate(0 230)">
      <rect x="0" y="0" width="520" height="44" rx="10" fill="#0A1018" stroke="#243041"/>
      <text x="18" y="28" fill="#3D9A6A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">$</text>
      <text x="38" y="28" fill="#C8D4E4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">milestone-agent --repo owner/name --phase M2</text>
    </g>
  </g>

  <!-- Right proof: mini report card from real demo shape -->
  <g transform="translate(700 48)">
    <rect x="0" y="0" width="444" height="284" rx="16" fill="#101820" stroke="#2A3A4E"/>
    <rect x="0" y="0" width="444" height="46" rx="16" fill="#16202C"/>
    <rect x="0" y="30" width="444" height="16" fill="#16202C"/>
    <circle cx="24" cy="23" r="5" fill="#DC4C4C"/>
    <circle cx="42" cy="23" r="5" fill="#E8A838"/>
    <circle cx="60" cy="23" r="5" fill="#3D9A6A"/>
    <text x="84" y="28" fill="#8A9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">report.md · demo run</text>

    <!-- Verdict -->
    <text x="28" y="82" fill="#6B8AAB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">RESULT</text>
    <rect x="28" y="94" width="148" height="36" rx="8" fill="#2A2110" stroke="#E8A838"/>
    <text x="42" y="118" fill="#E8A838" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">partially_met</text>

    <text x="210" y="82" fill="#6B8AAB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">SCORE</text>
    <text x="210" y="120" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="700">60</text>
    <text x="278" y="120" fill="#6B8AAB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">/100</text>

    <!-- Meter -->
    <rect x="28" y="150" width="388" height="10" rx="5" fill="#1A2430"/>
    <rect x="28" y="150" width="233" height="10" rx="5" fill="url(#scoreFill)"/>

    <!-- Stats row -->
    <g transform="translate(28 186)">
      <rect x="0" y="0" width="118" height="64" rx="10" fill="#0D141C" stroke="#243041"/>
      <text x="14" y="24" fill="#6B8AAB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ACTIVITY</text>
      <text x="14" y="48" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">66</text>

      <rect x="130" y="0" width="118" height="64" rx="10" fill="#0D141C" stroke="#243041"/>
      <text x="144" y="24" fill="#6B8AAB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">RULE PASS</text>
      <text x="144" y="48" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">50%</text>

      <rect x="260" y="0" width="128" height="64" rx="10" fill="#0D141C" stroke="#243041"/>
      <text x="274" y="24" fill="#6B8AAB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">EVIDENCE</text>
      <text x="274" y="48" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">6c · 1pr · 25i</text>
    </g>

    <!-- Rule line samples -->
    <g transform="translate(28 266)">
      <text x="0" y="0" fill="#3D9A6A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">✓ GCC-A1 scope documented</text>
      <text x="230" y="0" fill="#DC4C4C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">✗ GCC-A6 CI operational</text>
    </g>
  </g>
</svg>
