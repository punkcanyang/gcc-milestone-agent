rules:
  - id: GCC-A1
    text: Milestone scope is clearly documented
    keywords: [milestone, scope, deliverable, docs]

  - id: GCC-A2
    text: Submission issue or discussion thread exists
    keywords: [submission, issue, discussion]

  - id: GCC-A3
    text: Work artifacts are publicly traceable
    keywords: [commit, pr, release, repository]

  - id: GCC-A4
    text: Workflow and process transparency are described
    keywords: [workflow, process, transparency, public]

  - id: GCC-A5
    text: Verification output includes evidence links
    keywords: [evidence, link, report, verification]

  - id: GCC-A6
    text: CI pipeline is operational
    keywords: [ci, workflow, pass, success]
    source: github-actions

  - id: GCC-A7
    text: Project has community engagement
    keywords: [contributor, stars, forks, community]
    source: github-community

  - id: GCC-A8
    text: Package is published to registry
    keywords: [npm, package, publish, registry]
    source: npm-registry

  - id: GCC-A9
    text: External links in docs are reachable
    keywords: [url, link, reachable]
    source: url-checker
